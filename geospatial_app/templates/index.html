<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geospatial App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="controls" style="position: absolute; top: 10px; right: 10px; padding: 10px; background: white; z-index: 1000; border: 1px solid #ccc;">
        <div>
            <label for="layer-select">Choose a layer:</label>
            <select id="layer-select">
                <option value="sample_points">Sample Points</option>
                <option value="sample_lines">Sample Lines</option>
                <option value="sample_polygons">Sample Polygons</option>
            </select>
        </div>
        <div style="margin-top: 10px;">
            <button id="download-button">Download Current Layer</button>
        </div>
    </div>
    <div id="map" style="height: 600px;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
